name: Build

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Flavor'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - preview
          - canary
      createRelease:
        description: 'Publicar release no GitHub (apenas em release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.flavor }} (${{ inputs.buildType }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install xz-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Generate Gradle wrapper
        run: |
          chmod +x setup.sh
          ./setup.sh
          chmod +x gradlew

      - name: Resolve build parameters
        id: cfg
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
          INPUT_TYPE: ${{ inputs.buildType }}
        run: |
          flavor_cap="$(echo "$INPUT_FLAVOR" | awk '{print toupper(substr($0,1,1))substr($0,2)}')"
          type_cap="$(echo "$INPUT_TYPE" | awk '{print toupper(substr($0,1,1))substr($0,2)}')"
          echo "flavor=$INPUT_FLAVOR" >> "$GITHUB_OUTPUT"
          echo "flavor_cap=$flavor_cap" >> "$GITHUB_OUTPUT"
          echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          echo "type_cap=$type_cap" >> "$GITHUB_OUTPUT"

      - name: Assemble APK
        env:
          LARP_VERSION_CODE: ${{ github.run_number }}
          LARP_VERSION_NAME: 1.0.${{ github.run_number }}
          LARP_GIT_SHA: ${{ github.sha }}
        run: ./gradlew :app:assemble${{ steps.cfg.outputs.flavor_cap }}${{ steps.cfg.outputs.type_cap }} --stacktrace

      - name: Run unit tests
        if: inputs.buildType != 'release'
        run: ./gradlew :app:test${{ steps.cfg.outputs.flavor_cap }}${{ steps.cfg.outputs.type_cap }}UnitTest --stacktrace || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: larp-launcher-${{ steps.cfg.outputs.flavor }}-${{ steps.cfg.outputs.type }}
          path: app/build/outputs/apk/${{ steps.cfg.outputs.flavor }}/${{ steps.cfg.outputs.type }}/*.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release
    if: inputs.createRelease == true && inputs.buildType == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larp Launcher v1.0.${{ github.run_number }}
          files: dist/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.flavor != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
