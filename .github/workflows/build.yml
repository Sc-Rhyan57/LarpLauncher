name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Flavor'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - preview
          - canary
      createRelease:
        description: 'Publicar release no GitHub (apenas em release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.flavor || 'stable' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.event.inputs.flavor || 'stable' }} (${{ github.event.inputs.buildType || 'debug' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install xz-utils (for Frida gadget decompression)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Compute flavor capitalization
        id: fv
        run: |
          f="${{ github.event.inputs.flavor || 'stable' }}"
          cap="$(echo "$f" | awk '{print toupper(substr($0,1,1))substr($0,2)}')"
          echo "flavor_cap=$cap" >> "$GITHUB_OUTPUT"
          echo "flavor=$f" >> "$GITHUB_OUTPUT"

      - name: Compute build type capitalization
        id: bt
        run: |
          t="${{ github.event.inputs.buildType || 'debug' }}"
          cap="$(echo "$t" | awk '{print toupper(substr($0,1,1))substr($0,2)}')"
          echo "type_cap=$cap" >> "$GITHUB_OUTPUT"
          echo "type=$t" >> "$GITHUB_OUTPUT"

      - name: Assemble APK (downloads Frida gadget automatically)
        env:
          LARP_VERSION_CODE: ${{ github.run_number }}
          LARP_VERSION_NAME: ${{ github.event.release.tag_name || '0.1.0' }}
          LARP_GIT_SHA: ${{ github.sha }}
        run: ./gradlew :app:assemble${{ steps.fv.outputs.flavor_cap }}${{ steps.bt.outputs.type_cap }} --stacktrace

      - name: Run unit tests
        if: github.event.inputs.buildType != 'release'
        run: ./gradlew :app:test${{ steps.fv.outputs.flavor_cap }}${{ steps.bt.outputs.type_cap }}UnitTest --stacktrace || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: larp-launcher-${{ steps.fv.outputs.flavor }}-${{ steps.bt.outputs.type }}
          path: app/build/outputs/apk/${{ steps.fv.outputs.flavor }}/${{ steps.bt.outputs.type }}/*.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.createRelease == 'true' && github.event.inputs.buildType == 'release')
      || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.createRelease }}" = "true" ]; then
            echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Larp Launcher ${{ steps.tag.outputs.name }}
          files: dist/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-preview') || contains(steps.tag.outputs.name, '-canary') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
